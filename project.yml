name: NinngennSeiza
options:
  bundleIdPrefix: com.enludus
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  NinngennSeiza:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.ninngennseiza
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GameCore
packages:
  GameCore:
    path: Packages/GameCore
